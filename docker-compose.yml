version: '3.8'

services:
  forensic-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-forensics-lab:latest
    container_name: digital_forensics_lab
    volumes:
      - ./:/workspace
    ports:
      - "8888:8888" # Jupyter Lab
      - "8080:8080" # Web interfaces / demo tools
    environment:
      - TZ=UTC
    stdin_open: true
    tty: true
    command: >
      bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='forensics'"
